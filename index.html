<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6f8">
  <title>두근두근 이름궁합</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #382d36;
      background: #ffe5ee;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(circle at 8% 18%, rgba(255, 255, 255, .8) 0 5px, transparent 6px),
        radial-gradient(circle at 92% 23%, rgba(255, 255, 255, .7) 0 8px, transparent 9px),
        radial-gradient(circle at 16% 82%, rgba(255, 255, 255, .7) 0 7px, transparent 8px),
        radial-gradient(circle at 84% 74%, rgba(255, 255, 255, .55) 0 10px, transparent 11px),
        radial-gradient(ellipse at 12% 18%, #ffc7dc 0, transparent 38%),
        radial-gradient(ellipse at 88% 82%, #ffd9e8 0, transparent 42%),
        linear-gradient(145deg, #ffeaf1, #ffd8e6 52%, #ffedf3);
    }

    .card {
      position: relative;
      width: min(100%, 480px);
      padding: clamp(24px, 6vw, 42px);
      border: 3px solid rgba(255, 255, 255, .9);
      border-radius: 34px;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 232, 240, .65) 0 4px, transparent 5px),
        rgba(255, 250, 252, .97);
      box-shadow: 0 25px 70px rgba(190, 83, 125, .2), 0 5px 0 rgba(255, 255, 255, .75) inset;
      text-align: center;
    }

    .card::before,
    .card::after {
      position: absolute;
      z-index: 1;
      color: #f2a0ba;
      pointer-events: none;
    }

    .card::before {
      top: 13px;
      right: 22px;
      content: "♡";
      font-size: 24px;
      transform: rotate(12deg);
    }

    .card::after {
      bottom: 17px;
      left: 20px;
      content: "✦";
      font-size: 18px;
      transform: rotate(-12deg);
    }

    .landing {
      position: relative;
      padding: 18px 0 12px;
    }

    .landing::before,
    .landing::after {
      position: absolute;
      color: #f3a2bd;
      pointer-events: none;
    }

    .landing::before {
      top: 38%;
      left: 2%;
      content: "✦";
      font-size: 24px;
      transform: rotate(-12deg);
    }

    .landing::after {
      right: 3%;
      bottom: 24%;
      content: "♡";
      font-size: 29px;
      transform: rotate(12deg);
    }

    .landing-kicker {
      display: inline-block;
      margin: 0 0 8px;
      padding: 6px 13px;
      border: 1px solid #f8d3df;
      border-radius: 999px;
      background: #fff1f6;
      color: #d65b83;
      font-size: 12px;
      letter-spacing: .1em;
    }

    .landing h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 8vw, 40px);
      line-height: 1.2;
    }

    .landing-copy {
      margin: 0 0 22px;
      color: #9a7c89;
      font-size: 15px;
    }

    .heart-button-wrap {
      position: relative;
      width: min(100%, 290px);
      aspect-ratio: 1.12;
      margin: 0 auto;
    }

    .heart-shape {
      position: absolute;
      inset: 3% 2% 5%;
      border-radius: 0;
      background: linear-gradient(145deg, #ffabc2 4%, #fa789f 52%, #e95380 100%);
      clip-path: polygon(50% 96%, 17% 69%, 10% 63%, 5% 57%, 2% 50%, 0 43%, 0 36%, 2% 29%, 6% 22%, 11% 16%, 18% 11%, 25% 9%, 32% 9%, 39% 12%, 45% 17%, 50% 23%, 55% 17%, 61% 12%, 68% 9%, 75% 9%, 82% 11%, 89% 16%, 94% 22%, 98% 29%, 100% 36%, 100% 43%, 98% 50%, 95% 57%, 90% 63%, 83% 69%);
      filter: drop-shadow(0 15px 17px rgba(205, 62, 111, .28));
      animation: heartbeat 1.35s ease-in-out infinite;
      pointer-events: none;
    }

    .start-button {
      position: absolute;
      inset: 0;
      display: grid;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0 32px 10px;
      place-content: center;
      gap: 5px;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: #fff;
      font-size: 16px;
    }

    .heart-button-wrap:hover .heart-shape,
    .heart-button-wrap:focus-within .heart-shape {
      filter: drop-shadow(0 16px 18px rgba(205, 62, 111, .32)) brightness(1.04);
    }

    .start-button:focus-visible { outline: none; }

    .start-button:active { transform: scale(.96); }

    .start-button-label,
    .start-button-hint {
      position: relative;
      z-index: 1;
    }

    .start-button-label {
      margin-top: 21px;
      font-size: clamp(23px, 6vw, 29px);
      text-shadow: 0 2px 6px rgba(155, 44, 82, .2);
    }

    .start-button-hint {
      font-size: 13px;
      opacity: .9;
    }

    .landing-note {
      margin: 10px 0 0;
      color: #a1949b;
      font-size: 12px;
    }

    .app-content[hidden],
    .landing[hidden] { display: none; }

    .back-button {
      display: block;
      width: auto;
      margin: 0 0 18px;
      padding: 7px 11px;
      border: 1px solid #f1dce5;
      border-radius: 999px;
      background: #fff4f8;
      box-shadow: none;
      color: #b65b78;
      font-size: 13px;
    }

    .back-button:hover { background: #fff0f5; }

    .eyebrow {
      display: inline-block;
      margin: 0 0 10px;
      padding: 6px 13px;
      border: 1px solid #f8d3df;
      border-radius: 999px;
      background: #fff1f6;
      color: #d65b83;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 36px);
      letter-spacing: -.06em;
    }

    .intro {
      margin: 11px 0 28px;
      color: #9a7c89;
      font-size: 14px;
      line-height: 1.65;
    }

    .name-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .name-fields input {
      width: 100%;
      min-width: 0;
      padding: 15px 8px;
      border: 2px solid #f5e1e8;
      border-radius: 18px;
      outline: none;
      background: linear-gradient(180deg, #fff, #fffafd);
      color: #382d36;
      font: inherit;
      font-size: 16px;
      text-align: center;
      transition: border-color .2s, box-shadow .2s;
    }

    .name-fields input::placeholder { color: #b6aab1; }

    .name-fields input:focus {
      border-color: #ed91ad;
      box-shadow: 0 0 0 4px #fce8ef, 0 4px 12px rgba(220, 111, 150, .1);
    }

    .heart {
      color: #e66c91;
      font-size: 23px;
      animation: heartbeat 1.6s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.09); }
      24% { transform: scale(1); }
      36% { transform: scale(1.07); }
      52% { transform: scale(1); }
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px 20px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(100deg, #f58eae, #e85c86);
      box-shadow: 0 7px 0 #d9527c, 0 12px 20px rgba(220, 91, 131, .2);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      transition: transform .15s, filter .15s, box-shadow .15s;
    }

    button:hover { filter: brightness(1.04); }
    button:active { transform: translateY(3px); box-shadow: 0 4px 0 #d9527c, 0 7px 12px rgba(220, 91, 131, .16); }
    button:focus-visible { outline: 3px solid #f5b5c9; outline-offset: 3px; }

    .error {
      min-height: 21px;
      margin: 10px 0 0;
      color: #bd365d;
      font-size: 13px;
    }

    .result {
      margin-top: 13px;
      padding: 22px 18px 18px;
      border: 1px dashed #efc7d5;
      border-radius: 24px;
      background: linear-gradient(155deg, #fff7fa, #fffdfd);
      animation: appear .35s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-label {
      margin: 0;
      color: #9a7c89;
      font-size: 13px;
      font-weight: 700;
    }

    .score {
      margin: 2px 0 12px;
      color: #e45d86;
      font-size: clamp(58px, 15vw, 76px);
      font-weight: 900;
      letter-spacing: -.07em;
      line-height: 1.2;
      text-shadow: 0 4px 0 #ffe2eb;
    }

    .score span {
      margin-left: 3px;
      font-size: 25px;
      letter-spacing: 0;
    }

    .meter {
      height: 13px;
      overflow: hidden;
      border-radius: 99px;
      padding: 2px;
      background: #f9e9ef;
    }

    .meter-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffc4d5, #ff91b0, #e45d86);
      transition: width .8s cubic-bezier(.2, .8, .2, 1);
    }

    .message {
      display: inline-block;
      margin: 16px 0 4px;
      padding: 9px 14px;
      border-radius: 999px;
      background: #ffedf3;
      color: #ba4f72;
      font-size: 16px;
      font-weight: 750;
    }

    .daily-match {
      position: relative;
      margin-top: 20px;
      padding: 18px 14px 16px;
      overflow: hidden;
      border: 2px solid #f6d2de;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff0f5, #fffafd 70%);
      box-shadow: 0 5px 0 #fce4ec;
    }

    .daily-match::after {
      position: absolute;
      top: 8px;
      right: 12px;
      color: #efb1c5;
      content: "✧";
      font-size: 24px;
    }

    .daily-match-label {
      margin: 0;
      color: #b66b86;
      font-size: 13px;
    }

    .daily-match-name {
      margin: 5px 0 0;
      color: #d34f7a;
      font-size: clamp(29px, 8vw, 38px);
      line-height: 1.3;
    }

    .daily-match-score {
      display: inline-block;
      margin: 5px 0 0;
      padding: 5px 12px;
      border-radius: 999px;
      background: #fff;
      color: #9c6278;
      font-size: 13px;
    }

    .daily-match-note {
      margin: 10px 0 0;
      color: #9a7c89;
      font-size: 12px;
      line-height: 1.6;
    }

    .music-button {
      width: auto;
      margin-top: 12px;
      padding: 9px 16px;
      border: 1px solid #f3cada;
      border-radius: 999px;
      background: #fff3f7;
      box-shadow: none;
      color: #b94f73;
      font-size: 14px;
    }

    .music-button:hover { background: #ffeaf1; }

    .music-status {
      min-height: 18px;
      margin: 7px 0 0;
      color: #9a7f8a;
      font-size: 11px;
    }

    .advice {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #f5dce5;
      border-radius: 20px;
      background: linear-gradient(135deg, #fff4f8, #fffafd);
      text-align: left;
    }

    .advice h2 {
      margin: 0 0 7px;
      color: #c94f77;
      font-size: 16px;
    }

    .advice p {
      margin: 0;
      color: #73616b;
      font-size: 14px;
      line-height: 1.7;
    }

    .disclaimer {
      margin: 22px 0 0;
      color: #a1949b;
      font-size: 11px;
      line-height: 1.6;
    }

    details {
      margin-top: 16px;
      color: #9a7c89;
      font-size: 12px;
      text-align: left;
    }

    summary { cursor: pointer; color: #bd718c; }

    .steps {
      margin-top: 10px;
      padding: 12px;
      border-radius: 15px;
      background: #fff5f8;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    @media (max-width: 380px) {
      .name-fields { grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); gap: 7px; }
      .result { padding-inline: 12px; }
      .message { border-radius: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="landing" id="landing" aria-labelledby="landing-title">
      <p class="landing-kicker">LOVE IS IN THE AIR</p>
      <h1 id="landing-title">두근두근<br>천생연분</h1>
      <p class="landing-copy">우리 이름으로 알아보는 설레는 궁합</p>
      <div class="heart-button-wrap">
        <div class="heart-shape" aria-hidden="true"></div>
        <button class="start-button" id="start-button" type="button" aria-label="두근두근 천생연분 시작하기">
          <span class="start-button-label">두근두근<br>천생연분</span>
          <span class="start-button-hint">하트를 눌러 시작하기</span>
        </button>
      </div>
      <p class="landing-note">두 사람의 이름을 넣고 궁합을 확인해 보세요 💌</p>
    </section>

    <section class="app-content" id="app-content" hidden>
      <button class="back-button" id="back-button" type="button">← 시작 화면</button>
      <p class="eyebrow">LOVE CHEMISTRY</p>
      <h1>두근두근 이름궁합 <span aria-hidden="true">💕</span></h1>
      <p class="intro">두 사람의 이름으로 알아보는<br>오늘의 재미있는 궁합 점수</p>

      <form id="match-form" novalidate>
        <div class="name-fields">
          <label>
            <span class="sr-only">내 이름</span>
            <input id="name-a" name="name-a" type="text" maxlength="10"
              autocomplete="given-name" placeholder="내 이름" aria-label="내 이름">
          </label>
          <span class="heart" aria-hidden="true">♥</span>
          <label>
            <span class="sr-only">상대 이름</span>
            <input id="name-b" name="name-b" type="text" maxlength="10"
              placeholder="상대 이름" aria-label="상대 이름">
          </label>
        </div>
        <button type="submit">궁합 확인하기 <span aria-hidden="true">→</span></button>
        <p class="error" id="error" role="alert"></p>
      </form>

      <section class="result" id="result" aria-live="polite" hidden>
        <p class="result-label">두 사람의 이름 궁합은</p>
        <p class="score" id="score"></p>
        <div class="meter" role="progressbar" aria-label="이름 궁합 점수" aria-valuemin="0" aria-valuemax="100">
          <div class="meter-fill" id="meter-fill"></div>
        </div>
        <p class="message" id="message"></p>
        <button class="music-button" id="music-button" type="button">♪ 귀여운 노래 다시 듣기</button>
        <p class="music-status" id="music-status" aria-live="polite"></p>
        <aside class="advice" aria-labelledby="advice-title">
          <h2 id="advice-title">관계를 더 키우는 작은 팁 💌</h2>
          <p id="advice"></p>
        </aside>
        <details>
          <summary>계산 과정 보기</summary>
          <div class="steps" id="steps"></div>
        </details>
        <aside class="daily-match" aria-labelledby="daily-match-label">
          <p class="daily-match-label" id="daily-match-label">오늘 내 이름과 찰떡인 이름은</p>
          <p class="daily-match-name" id="daily-match-name"></p>
          <p class="daily-match-score" id="daily-match-score"></p>
          <p class="daily-match-note">이름 후보 중 오늘의 점수가 가장 높은 이름이에요 ✨</p>
        </aside>
      </section>

      <p class="disclaimer">이 결과는 한글 이름 획수를 활용한 놀이 콘텐츠예요.<br>실제 관계는 서로를 알아가는 마음이 가장 중요해요.</p>
    </section>
  </main>

  <script>
    const INITIAL_STROKES = [2, 4, 2, 3, 6, 5, 4, 4, 8, 2, 4, 1, 3, 6, 4, 3, 4, 4, 3];
    const VOWEL_STROKES = [2, 3, 3, 4, 2, 3, 3, 4, 2, 4, 5, 3, 3, 2, 4, 5, 3, 3, 1, 2, 1];
    const FINAL_STROKES = [0, 2, 4, 4, 2, 5, 5, 3, 5, 7, 9, 9, 7, 9, 9, 8, 4, 4, 6, 2, 4, 1, 3, 4, 3, 4, 4, 3];
    const DAILY_NAME_CANDIDATES = [
      "지민", "지우", "서우", "하늘", "시온", "수현", "유진", "민서", "지안",
      "은우", "다온", "하랑", "연우", "윤서", "주원", "채원", "가온", "서진",
      "지원", "선우", "도윤", "유나", "서연", "하윤", "태오", "현우", "예린",
      "시우", "아린", "재이"
    ];

    const landing = document.querySelector("#landing");
    const appContent = document.querySelector("#app-content");
    const startButton = document.querySelector("#start-button");
    const backButton = document.querySelector("#back-button");
    const form = document.querySelector("#match-form");
    const inputA = document.querySelector("#name-a");
    const inputB = document.querySelector("#name-b");
    const error = document.querySelector("#error");
    const result = document.querySelector("#result");
    const scoreElement = document.querySelector("#score");
    const messageElement = document.querySelector("#message");
    const dailyMatchName = document.querySelector("#daily-match-name");
    const dailyMatchScore = document.querySelector("#daily-match-score");
    const adviceElement = document.querySelector("#advice");
    const musicButton = document.querySelector("#music-button");
    const musicStatus = document.querySelector("#music-status");
    const stepsElement = document.querySelector("#steps");
    const meter = document.querySelector(".meter");
    const meterFill = document.querySelector("#meter-fill");
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioContext = null;
    let activeMusicGain = null;
    let playbackId = 0;

    startButton.addEventListener("click", () => {
      landing.hidden = true;
      appContent.hidden = false;
      inputA.focus();
    });

    backButton.addEventListener("click", () => {
      stopTune();
      form.reset();
      error.textContent = "";
      result.hidden = true;
      meterFill.style.width = "0";
      meter.removeAttribute("aria-valuenow");
      meter.removeAttribute("aria-valuetext");
      musicStatus.textContent = "";
      result.querySelector("details").open = false;
      appContent.hidden = true;
      landing.hidden = false;
      startButton.focus();
    });

    function countStrokes(character) {
      const code = character.codePointAt(0) - 0xac00;
      if (code < 0 || code > 11171) return null;

      const initial = Math.floor(code / 588);
      const vowel = Math.floor((code % 588) / 28);
      const final = code % 28;
      return INITIAL_STROKES[initial] + VOWEL_STROKES[vowel] + FINAL_STROKES[final];
    }

    function nameStrokes(name) {
      return Array.from(name, countStrokes);
    }

    function scoreNames(firstName, secondName) {
      let row = [];
      const length = Math.max(firstName.length, secondName.length);
      for (let index = 0; index < length; index += 1) {
        if (index < firstName.length) row.push(firstName[index]);
        if (index < secondName.length) row.push(secondName[index]);
      }

      const rows = [row.slice()];
      while (row.length > 2) {
        row = row.slice(1).map((value, index) => (value + row[index]) % 10);
        rows.push(row.slice());
      }

      const score = row.length === 2 ? row[0] * 10 + row[1] : row[0];
      return { score, rows };
    }

    function dailySeed(name) {
      const now = new Date();
      const today = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
      let hash = 0;
      for (const character of `${today}:${name}`) {
        hash = (Math.imul(hash, 31) + character.codePointAt(0)) | 0;
      }
      return hash >>> 0;
    }

    function bestDailyName(name, nameStrokesForInput) {
      const candidates = DAILY_NAME_CANDIDATES
        .filter((candidate) => candidate !== name)
        .map((candidate) => ({
          name: candidate,
          score: scoreNames(nameStrokesForInput, nameStrokes(candidate)).score
        }));
      const highestScore = Math.max(...candidates.map((candidate) => candidate.score));
      const bestCandidates = candidates.filter((candidate) => candidate.score === highestScore);
      return bestCandidates[dailySeed(name) % bestCandidates.length];
    }

    function interpretationFor(score, nameA, nameB) {
      if (score >= 90) {
        return {
          message: "두근두근, 거의 운명 같은 천생연분! 💞",
          advice: `${nameA}님과 ${nameB}님, 서로 잘 통하는 만큼 고마운 점을 자주 말로 전해 보세요. 함께 새로운 취미나 작은 약속을 만들어 추억을 쌓으면 좋아요.`
        };
      }
      if (score >= 80) {
        return {

        };
      }
      if (score >= 70) {
        return {
          message: "대화가 술술, 기분 좋은 궁합이에요! 😍",
          advice: "요즘 관심 있는 이야기를 나누고 가벼운 약속을 먼저 제안해 보세요. 함께 웃는 시간이 친밀감을 키워줘요."
        };
      }
      if (score >= 60) {
        return {
          message: "조금씩 알아갈수록 설렘이 커지는 사이! 🌷",
          advice: "서로 좋아하는 장소나 음식을 물어보고, 부담 없는 짧은 만남부터 제안해 보세요."
        };
      }
      if (score >= 50) {
        return {
          message: "공통점을 발견하면 더 잘 통할 수 있어요! 🙂",
          advice: "함께 좋아할 만한 주제를 찾아 대화를 이어가 보세요. 작은 배려와 칭찬도 마음을 가까이해 줘요."
        };
      }
      if (score >= 40) {
        return {
          message: "서로 다른 매력이 호기심을 부르는 궁합! 💫",
          advice: "상대의 취향을 판단하지 말고 궁금해하며 물어보세요. 서로의 차이를 알아가는 대화를 즐겨 보세요."
        };
      }
      if (score >= 30) {
        return {
          message: "천천히 알아가면 새로운 매력이 보여요! 🐢",
          advice: "서로의 속도를 존중하며 편안한 안부부터 건네 보세요. 대화할 때는 내 이야기만큼 상대의 이야기도 귀 기울여 들어주세요."
        };
      }
      if (score >= 20) {
        return {
          message: "아직은 탐색 중! 알아갈 이야기가 가득해요 🔎",

      };
    }

    function stopTune() {
      playbackId += 1;
      if (audioContext && activeMusicGain) {
        const now = audioContext.currentTime;
        activeMusicGain.gain.cancelScheduledValues(now);
        activeMusicGain.gain.setValueAtTime(Math.max(activeMusicGain.gain.value, 0.0001), now);
        activeMusicGain.gain.linearRampToValueAtTime(0.0001, now + 0.04);
        activeMusicGain = null;
      }
      musicButton.textContent = "♪ 귀여운 노래 다시 듣기";
      musicButton.setAttribute("aria-pressed", "false");
    }

    async function playTune() {
      if (!AudioContextClass) {
        musicStatus.textContent = "이 브라우저에서는 음악 재생을 지원하지 않아요.";
        return;
      }

      stopTune();
      const currentPlayback = playbackId;
      try {
        if (!audioContext) audioContext = new AudioContextClass();
        await audioContext.resume();
        if (currentPlayback !== playbackId) return;

        const master = audioContext.createGain();
        master.gain.setValueAtTime(0.22, audioContext.currentTime);
        master.connect(audioContext.destination);
        activeMusicGain = master;

        const melody = [523.25, 659.25, 783.99, 659.25, 880, 783.99, 659.25, 587.33, 523.25];
        const beat = 0.2;
        const startAt = audioContext.currentTime + 0.04;
        melody.forEach((frequency, index) => {
          const noteStart = startAt + index * beat;
          const noteLength = beat * 0.78;
          const oscillator = audioContext.createOscillator();
          const envelope = audioContext.createGain();
          oscillator.type = "triangle";
          oscillator.frequency.setValueAtTime(frequency, noteStart);
          envelope.gain.setValueAtTime(0.0001, noteStart);
          envelope.gain.exponentialRampToValueAtTime(0.7, noteStart + 0.025);
          envelope.gain.exponentialRampToValueAtTime(0.0001, noteStart + noteLength);
          oscillator.connect(envelope);
          envelope.connect(master);
          oscillator.start(noteStart);
          oscillator.stop(noteStart + noteLength + 0.02);
        });

        musicButton.textContent = "♫ 노래 멈추기";
        musicButton.setAttribute("aria-pressed", "true");
        musicStatus.textContent = "두근두근 멜로디가 재생 중이에요!";
        window.setTimeout(() => {
          if (currentPlayback !== playbackId) return;
          activeMusicGain = null;
          musicButton.textContent = "♪ 귀여운 노래 다시 듣기";
          musicButton.setAttribute("aria-pressed", "false");
          musicStatus.textContent = "설레는 멜로디를 다시 듣고 싶다면 눌러 주세요.";
        }, melody.length * beat * 1000);
      } catch (playbackError) {
        console.error("이름 궁합 멜로디를 재생하지 못했습니다.", playbackError);
        musicStatus.textContent = "음악을 재생하지 못했어요. 브라우저의 소리 설정을 확인해 주세요.";
      }
    }

    musicButton.addEventListener("click", () => {
      if (activeMusicGain) {
        stopTune();
        musicStatus.textContent = "노래를 멈췄어요. 버튼을 누르면 다시 들을 수 있어요.";
        return;
      }
      playTune();
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      error.textContent = "";
      result.hidden = true;

      const nameA = inputA.value.trim();
      const nameB = inputB.value.trim();
      if (!nameA || !nameB) {
        error.textContent = "두 사람의 이름을 모두 입력해 주세요.";
        (!nameA ? inputA : inputB).focus();
        return;
      }

      const strokesA = nameStrokes(nameA);
      const strokesB = nameStrokes(nameB);
      if (strokesA.includes(null) || strokesB.includes(null)) {
        error.textContent = "완성된 한글 이름으로 입력해 주세요.";
        return;
      }

      const { score, rows } = scoreNames(strokesA, strokesB);
      const dailyMatch = bestDailyName(nameA, strokesA);
      scoreElement.replaceChildren(
        document.createTextNode(String(score)),
        Object.assign(document.createElement("span"), { textContent: "%" })
      );
      const interpretation = interpretationFor(score, nameA, nameB);
      messageElement.textContent = interpretation.message;
      adviceElement.textContent = interpretation.advice;
      dailyMatchName.textContent = dailyMatch.name;
      dailyMatchScore.textContent = `오늘의 이름 궁합 ${dailyMatch.score}%`;
      meter.setAttribute("aria-valuenow", String(score));
      meter.setAttribute("aria-valuetext", `궁합 점수 ${score}점`);
      meterFill.style.width = `${score}%`;

      stepsElement.replaceChildren();
      const nameLine = document.createElement("div");
      nameLine.textContent = `${nameA}: ${strokesA.join(" · ")}  |  ${nameB}: ${strokesB.join(" · ")}`;
      stepsElement.append(nameLine);
      rows.forEach((row, index) => {
        const line = document.createElement("div");
        line.textContent = `${index === 0 ? "시작" : "계산"}: ${row.join(" · ")}`;
        stepsElement.append(line);
      });

      result.hidden = false;
      musicStatus.textContent = "";
      playTune();
    });
  </script>
